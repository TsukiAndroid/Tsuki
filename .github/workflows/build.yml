name: Build Tsuki APK

on:
  push:
    branches: [ devel, main ]
  pull_request:
    branches: [ devel, main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Fetch latest parsers commit
        run: |
          LATEST=$(curl -s "https://api.github.com/repos/Kotatsu-Redo/kotatsu-parsers-redo/commits/master" \
            -H "Accept: application/vnd.github.sha" | cut -c -10)
          echo "Latest parsers commit: $LATEST"
          sed -i "s/parsers = \".*\"/parsers = \"$LATEST\"/" gradle/libs.versions.toml

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-configuration-cache

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Tsuki-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
