name: Build Tsuki APK

on:
  push:
    branches: [ devel, main ]
    paths-ignore:
      - 'CHANGELOG.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.flavor_label }} APK
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: alpha
            flavor_label: Alpha
            task: assembleAlphaRelease
            apk_path: app/build/outputs/apk/alpha/release
            tag: alpha-latest
            prerelease: true
          - flavor: beta
            flavor_label: Beta
            task: assembleBetaRelease
            apk_path: app/build/outputs/apk/beta/release
            tag: beta-latest
            prerelease: true
          - flavor: stable
            flavor_label: Stable
            task: assembleStableRelease
            apk_path: app/build/outputs/apk/stable/release
            tag: stable-latest
            prerelease: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate version name
        id: version
        run: |
          COMMIT_COUNT=$(git rev-list --count HEAD)
          echo "VERSION_NAME=1.${COMMIT_COUNT}" >> $GITHUB_OUTPUT
          echo "VERSION_CODE=${COMMIT_COUNT}" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        run: |
          set -e
          PREV_TAG="${{ matrix.tag }}-prev"
          if git rev-parse --verify "refs/tags/${PREV_TAG}" >/dev/null 2>&1; then
            RANGE="${PREV_TAG}..HEAD"
          else
            RANGE="-50"
          fi

          {
            echo "## ${{ matrix.flavor_label }} ${{ steps.version.outputs.VERSION_NAME }} (Build #${{ github.run_number }})"
            echo ""
            echo "_$(date -u +'%Y-%m-%d %H:%M UTC')_"
            echo ""
            git log "$RANGE" --pretty=format:'- %s (%h)' --no-merges \
              | grep -viE '^- (chore|ci|docs)\(?(changelog|ci|build)\)?:|^- Update CHANGELOG' \
              | head -n 100 || true
            echo ""
            echo ""
          } > NEW_ENTRY.md

          if [ -f CHANGELOG.md ]; then
            cat NEW_ENTRY.md CHANGELOG.md > CHANGELOG.md.tmp
            mv CHANGELOG.md.tmp CHANGELOG.md
          else
            echo "# Changelog" > CHANGELOG.md
            echo "" >> CHANGELOG.md
            cat NEW_ENTRY.md >> CHANGELOG.md
          fi

          {
            echo 'BODY<<__EOF__'
            cat NEW_ENTRY.md
            echo '__EOF__'
          } >> $GITHUB_OUTPUT

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_FILE }}" | base64 -d > app/keystore.jks

      - name: Build ${{ matrix.flavor_label }} Release APK
        run: ./gradlew ${{ matrix.task }} --stacktrace --no-configuration-cache
        env:
          VERSION_NAME: ${{ steps.version.outputs.VERSION_NAME }}
          VERSION_CODE: ${{ steps.version.outputs.VERSION_CODE }}
          KEYSTORE_FILE: keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload ${{ matrix.flavor_label }} APK (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Tsuki-${{ matrix.flavor }}-${{ github.run_number }}
          path: ${{ matrix.apk_path }}/*.apk
          retention-days: 30

      - name: Snapshot previous ${{ matrix.tag }} tag for next diff
        run: |
          git fetch --tags --force
          if git rev-parse --verify refs/tags/${{ matrix.tag }} >/dev/null 2>&1; then
            PREV_SHA=$(git rev-list -n 1 refs/tags/${{ matrix.tag }})
            git tag -f ${{ matrix.tag }}-prev "$PREV_SHA"
            git push -f origin refs/tags/${{ matrix.tag }}-prev || true
          fi

      - name: Delete old ${{ matrix.tag }} release
        run: gh release delete "${{ matrix.tag }}" --yes || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete old ${{ matrix.tag }} tag
        run: git push origin :refs/tags/${{ matrix.tag }} || true

      - name: Commit updated CHANGELOG.md
        continue-on-error: true
        run: |
          if git diff --quiet CHANGELOG.md; then
            echo "No changelog changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs(changelog): update ${{ matrix.flavor }} for build #${{ github.run_number }} [skip ci]"
          git pull --rebase --no-edit origin ${{ github.ref_name }} \
            && git push origin HEAD:${{ github.ref_name }} \
            || (git rebase --abort 2>/dev/null || true; echo "Changelog push skipped due to rebase conflict")

      - name: Create ${{ matrix.flavor_label }} Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ matrix.tag }}
          name: "Tsuki ${{ matrix.flavor_label }} ${{ steps.version.outputs.VERSION_NAME }} (Build #${{ github.run_number }})"
          body: |
            ## 🌙 Tsuki ${{ matrix.flavor_label }} ${{ steps.version.outputs.VERSION_NAME }}
            > Auto-built from latest commit · Build #${{ github.run_number }}

            ### What's new
            ${{ steps.changelog.outputs.BODY }}

            ### 📱 Pick the right APK for your device:
            | APK | Best for |
            |-----|----------|
            | `arm64-v8a` | Most modern phones (2017+) ✅ recommended |
            | `armeabi-v7a` | Older 32-bit Android phones |
            | `x86_64` | Emulators / rare Intel phones |
            | `universal` | Not sure? Just grab this one |

            ---
            🔗 Source: https://github.com/Space4414/Tsuki
          files: ${{ matrix.apk_path }}/*.apk
          prerelease: ${{ matrix.prerelease }}
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
