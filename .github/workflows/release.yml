name: Release Build

on:
  push:
    tags:
      - 'v[0-9]*'
      - 'alpha-[0-9]*'
      - 'beta-[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.60.0, alpha-1.2, beta-1.2)'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Determine flavor from tag
        id: flavor
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "TAG_NAME=${TAG}" >> $GITHUB_OUTPUT

          if [[ "$TAG" == alpha-* ]]; then
            echo "FLAVOR=alpha"          >> $GITHUB_OUTPUT
            echo "FLAVOR_LABEL=Alpha"    >> $GITHUB_OUTPUT
            echo "TASK=assembleAlphaRelease"                      >> $GITHUB_OUTPUT
            echo "APK_PATH=app/build/outputs/apk/alpha/release"   >> $GITHUB_OUTPUT
            echo "PRERELEASE=true"       >> $GITHUB_OUTPUT
            VERSION="${TAG#alpha-}"
          elif [[ "$TAG" == beta-* ]]; then
            echo "FLAVOR=beta"           >> $GITHUB_OUTPUT
            echo "FLAVOR_LABEL=Beta"     >> $GITHUB_OUTPUT
            echo "TASK=assembleBetaRelease"                       >> $GITHUB_OUTPUT
            echo "APK_PATH=app/build/outputs/apk/beta/release"    >> $GITHUB_OUTPUT
            echo "PRERELEASE=true"       >> $GITHUB_OUTPUT
            VERSION="${TAG#beta-}"
          else
            echo "FLAVOR=stable"         >> $GITHUB_OUTPUT
            echo "FLAVOR_LABEL=Stable"   >> $GITHUB_OUTPUT
            echo "TASK=assembleStableRelease"                      >> $GITHUB_OUTPUT
            echo "APK_PATH=app/build/outputs/apk/stable/release"  >> $GITHUB_OUTPUT
            echo "PRERELEASE=false"      >> $GITHUB_OUTPUT
            VERSION="${TAG#v}"
          fi

          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)
          PATCH=${PATCH:-0}
          CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          echo "VERSION_NAME=$VERSION"  >> $GITHUB_OUTPUT
          echo "VERSION_CODE=$CODE"     >> $GITHUB_OUTPUT

      - name: Set up signing key
        run: |
          if [ -n "${{ secrets.KEYSTORE_FILE }}" ]; then
            echo "Using production keystore from secrets"
            echo "${{ secrets.KEYSTORE_FILE }}" | base64 -d > ${{ github.workspace }}/keystore.jks
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}"                 >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}"           >> $GITHUB_ENV
          else
            # Fall back to the stable debug.keystore committed to the repo.
            # Using the same key on every build means users can install updates
            # without uninstalling first (no "package conflicts" signature error).
            echo "::warning::No KEYSTORE_FILE secret set — signing with committed debug.keystore (consistent key across all builds)."
            cp app/debug.keystore ${{ github.workspace }}/keystore.jks
            echo "KEYSTORE_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_ALIAS=debug"           >> $GITHUB_ENV
            echo "KEY_PASSWORD=android"      >> $GITHUB_ENV
          fi

      - name: Build ${{ steps.flavor.outputs.FLAVOR_LABEL }} Release APK
        env:
          VERSION_NAME:      ${{ steps.flavor.outputs.VERSION_NAME }}
          VERSION_CODE:      ${{ steps.flavor.outputs.VERSION_CODE }}
          KEYSTORE_FILE:     ${{ github.workspace }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ env.KEYSTORE_PASSWORD }}
          KEY_ALIAS:         ${{ env.KEY_ALIAS }}
          KEY_PASSWORD:      ${{ env.KEY_PASSWORD }}
        run: ./gradlew ${{ steps.flavor.outputs.TASK }} --stacktrace --no-configuration-cache

      - name: Create ${{ steps.flavor.outputs.FLAVOR_LABEL }} GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.flavor.outputs.TAG_NAME }}
          name: "Tsuki ${{ steps.flavor.outputs.FLAVOR_LABEL }} ${{ steps.flavor.outputs.VERSION_NAME }}"
          body: |
            ## Tsuki ${{ steps.flavor.outputs.FLAVOR_LABEL }} ${{ steps.flavor.outputs.VERSION_NAME }}

            ### 📱 Pick the right APK for your device:
            | APK filename | Best for |
            |--------------|----------|
            | `Tsuki-*-arm64-release.apk` | Most modern phones (2017+) ✅ recommended |
            | `Tsuki-*-arm32-release.apk` | Older 32-bit Android phones|
            | `Tsuki-*-x86_64-release.apk` | Emulators / rare Intel phones |
            | `Tsuki-*-universal-release.apk` | Not sure? Grab this one |
          files: ${{ steps.flavor.outputs.APK_PATH }}/*.apk
          prerelease: ${{ steps.flavor.outputs.PRERELEASE }}
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean up keystore
        if: always()
        run: rm -f ${{ github.workspace }}/keystore.jks
