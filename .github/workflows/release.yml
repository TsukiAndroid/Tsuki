name: Release Build

on:
  push:
    tags:
      - 'v[0-9]*'
      - 'alpha-[0-9]*'
      - 'beta-[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.60.0, alpha-1.2, beta-1.2)'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Determine flavor from tag
        id: flavor
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "TAG_NAME=${TAG}" >> $GITHUB_OUTPUT

          if [[ "$TAG" == alpha-* ]]; then
            echo "FLAVOR=alpha"          >> $GITHUB_OUTPUT
            echo "FLAVOR_LABEL=Alpha"    >> $GITHUB_OUTPUT
            echo "TASK=assembleAlphaRelease"                      >> $GITHUB_OUTPUT
            echo "APK_PATH=app/build/outputs/apk/alpha/release"   >> $GITHUB_OUTPUT
            echo "PRERELEASE=true"       >> $GITHUB_OUTPUT
            VERSION="${TAG#alpha-}"
          elif [[ "$TAG" == beta-* ]]; then
            echo "FLAVOR=beta"           >> $GITHUB_OUTPUT
            echo "FLAVOR_LABEL=Beta"     >> $GITHUB_OUTPUT
            echo "TASK=assembleBetaRelease"                       >> $GITHUB_OUTPUT
            echo "APK_PATH=app/build/outputs/apk/beta/release"    >> $GITHUB_OUTPUT
            echo "PRERELEASE=true"       >> $GITHUB_OUTPUT
            VERSION="${TAG#beta-}"
          else
            echo "FLAVOR=stable"         >> $GITHUB_OUTPUT
            echo "FLAVOR_LABEL=Stable"   >> $GITHUB_OUTPUT
            echo "TASK=assembleStableRelease"                      >> $GITHUB_OUTPUT
            echo "APK_PATH=app/build/outputs/apk/stable/release"  >> $GITHUB_OUTPUT
            echo "PRERELEASE=false"      >> $GITHUB_OUTPUT
            VERSION="${TAG#v}"
          fi

          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)
          PATCH=${PATCH:-0}
          CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          echo "VERSION_NAME=$VERSION"  >> $GITHUB_OUTPUT
          echo "VERSION_CODE=$CODE"     >> $GITHUB_OUTPUT

      - name: Set up keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_FILE }}" ]; then
            echo "Using keystore from secrets"
            echo "${{ secrets.KEYSTORE_FILE }}" | base64 -d > ${{ github.workspace }}/keystore.jks
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}"                 >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}"           >> $GITHUB_ENV
          else
            echo "No keystore secret – auto-generating a signing key for this build"
            keytool -genkeypair \
              -alias tsuki \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -keystore ${{ github.workspace }}/keystore.jks \
              -storepass tsukidev \
              -keypass tsukidev \
              -dname "CN=Tsuki,OU=Dev,O=Space4414,L=Unknown,ST=Unknown,C=US" \
              -noprompt
            echo "KEYSTORE_PASSWORD=tsukidev" >> $GITHUB_ENV
            echo "KEY_ALIAS=tsuki"            >> $GITHUB_ENV
            echo "KEY_PASSWORD=tsukidev"      >> $GITHUB_ENV
            echo "::warning::Auto-generated keystore used. Add KEYSTORE_FILE/KEYSTORE_PASSWORD/KEY_ALIAS/KEY_PASSWORD secrets for a stable release signing key."
          fi

      - name: Build ${{ steps.flavor.outputs.FLAVOR_LABEL }} Release APK
        env:
          VERSION_NAME:      ${{ steps.flavor.outputs.VERSION_NAME }}
          VERSION_CODE:      ${{ steps.flavor.outputs.VERSION_CODE }}
          KEYSTORE_FILE:     ${{ github.workspace }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ env.KEYSTORE_PASSWORD }}
          KEY_ALIAS:         ${{ env.KEY_ALIAS }}
          KEY_PASSWORD:      ${{ env.KEY_PASSWORD }}
        run: ./gradlew ${{ steps.flavor.outputs.TASK }} --stacktrace --no-configuration-cache

      - name: Create ${{ steps.flavor.outputs.FLAVOR_LABEL }} GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.flavor.outputs.TAG_NAME }}
          name: "Tsuki ${{ steps.flavor.outputs.FLAVOR_LABEL }} ${{ steps.flavor.outputs.VERSION_NAME }}"
          body: |
            ## Tsuki ${{ steps.flavor.outputs.FLAVOR_LABEL }} ${{ steps.flavor.outputs.VERSION_NAME }}

            ### 📱 Pick the right APK for your device:
            | APK | Best for |
            |-----|----------|
            | `arm64-v8a` | Most modern phones (2017+) ✅ recommended |
            | `armeabi-v7a` | Older 32-bit Android phones |
            | `x86_64` | Emulators / rare Intel phones |
            | `universal` | Not sure? Just grab this one |
          files: ${{ steps.flavor.outputs.APK_PATH }}/*.apk
          prerelease: ${{ steps.flavor.outputs.PRERELEASE }}
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean up keystore
        if: always()
        run: rm -f ${{ github.workspace }}/keystore.jks
