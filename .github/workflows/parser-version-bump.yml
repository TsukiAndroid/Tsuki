name: Bump Kotatsu Parsers Version

# Every night: if kotatsu-parsers-redo has a newer commit, this
#   1. puts the new version on a side branch (auto/bump-parsers),
#   2. waits until JitPack has built it (so the build does not time out),
#   3. test-compiles the app with it,
#   4. only if that works, opens (or updates) a pull request into devel.
# Nothing is pushed to devel by this workflow. You merge the pull request yourself.
# If the compile fails, the run turns red and no pull request is opened.

on:
  schedule:
    - cron: '0 3 * * *'   # Daily 03:00 UTC
  workflow_dispatch:        # Manual trigger

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: bump-parsers
  cancel-in-progress: false

jobs:
  bump-parsers:
    name: Check, test and propose kotatsu-parsers-redo bump
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout devel
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: devel
          fetch-depth: 0

      - name: Get latest clquwu/kotatsu-parsers-redo commit
        id: latest
        run: |
          LATEST_FULL=$(curl -fsSL \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.sha" \
            https://api.github.com/repos/clquwu/kotatsu-parsers-redo/commits/master)
          # JitPack resolves 10-char SHAs; truncate to match libs.versions.toml format
          LATEST_SHORT=${LATEST_FULL:0:10}
          echo "sha=${LATEST_SHORT}" >> "$GITHUB_OUTPUT"
          echo "Latest kotatsu-parsers-redo: ${LATEST_SHORT}"

      - name: Get current pinned version
        id: current
        run: |
          CURRENT=$(grep -m1 '^parsers = ' gradle/libs.versions.toml | sed 's/parsers = "//;s/"//')
          echo "sha=${CURRENT}" >> "$GITHUB_OUTPUT"
          echo "Current version on devel: ${CURRENT}"

      - name: Already proposed?
        id: proposed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW: ${{ steps.latest.outputs.sha }}
        run: |
          SKIP=false
          OPEN_PR=$(gh pr list --head auto/bump-parsers --base devel --state open --json number --jq '.[0].number' || true)
          if [ -n "$OPEN_PR" ]; then
            git fetch origin auto/bump-parsers 2>/dev/null || true
            if git show origin/auto/bump-parsers:gradle/libs.versions.toml 2>/dev/null | grep -q "^parsers = \"${NEW}\""; then
              SKIP=true
              echo "Pull request #${OPEN_PR} already proposes ${NEW}. Nothing to do."
            fi
          fi
          echo "skip=${SKIP}" >> "$GITHUB_OUTPUT"

      - name: Already up-to-date
        if: steps.latest.outputs.sha == steps.current.outputs.sha
        run: echo "kotatsu-parsers-redo already at ${{ steps.latest.outputs.sha }}"

      - name: Put the new version on a side branch
        if: steps.latest.outputs.sha != steps.current.outputs.sha && steps.proposed.outputs.skip != 'true'
        run: |
          OLD="${{ steps.current.outputs.sha }}"
          NEW="${{ steps.latest.outputs.sha }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B auto/bump-parsers
          sed -i "s/^parsers = \"${OLD}\"/parsers = \"${NEW}\"/" gradle/libs.versions.toml
          git add gradle/libs.versions.toml
          git commit -m "chore(deps): bump kotatsu-parsers-redo ${OLD} → ${NEW} [auto]"

      - name: Wait for JitPack to build the new version
        if: steps.latest.outputs.sha != steps.current.outputs.sha && steps.proposed.outputs.skip != 'true'
        run: |
          NEW="${{ steps.latest.outputs.sha }}"
          URL="https://jitpack.io/com/github/clquwu/kotatsu-parsers-redo/${NEW}/kotatsu-parsers-redo-${NEW}.pom"
          for i in $(seq 1 12); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 240 "$URL" || echo 000)
            echo "attempt ${i}: HTTP ${CODE}"
            if [ "$CODE" = "200" ]; then
              exit 0
            fi
            sleep 30
          done
          echo "::error::JitPack did not finish building ${NEW}. Run this workflow again later."
          exit 1

      - name: Set up JDK 21
        if: steps.latest.outputs.sha != steps.current.outputs.sha && steps.proposed.outputs.skip != 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle packages
        if: steps.latest.outputs.sha != steps.current.outputs.sha && steps.proposed.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Test-compile the app with the new parsers
        if: steps.latest.outputs.sha != steps.current.outputs.sha && steps.proposed.outputs.skip != 'true'
        run: |
          chmod +x gradlew
          ./gradlew :app:compileAlphaReleaseKotlin --stacktrace --no-configuration-cache

      - name: Push branch and open pull request
        if: steps.latest.outputs.sha != steps.current.outputs.sha && steps.proposed.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OLD="${{ steps.current.outputs.sha }}"
          NEW="${{ steps.latest.outputs.sha }}"
          TITLE="chore(deps): bump kotatsu-parsers-redo ${OLD} → ${NEW}"
          BODY="Automatic parsers update. The app compiled successfully with the new version. Merge this pull request to build it into the next Alpha."
          git push --force origin auto/bump-parsers
          EXISTING=$(gh pr list --head auto/bump-parsers --base devel --state open --json number --jq '.[0].number' || true)
          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --title "$TITLE" --body "$BODY"
            echo "Updated pull request #${EXISTING}."
          elif gh pr create --base devel --head auto/bump-parsers --title "$TITLE" --body "$BODY"; then
            echo "Opened a new pull request."
          else
            echo "::warning::The branch is pushed, but GitHub did not let this workflow open the pull request."
            echo "Open it yourself: https://github.com/${{ github.repository }}/compare/devel...auto/bump-parsers?expand=1" >> "$GITHUB_STEP_SUMMARY"
            echo "To allow automatic pull requests: Settings > Actions > General > Workflow permissions > tick 'Allow GitHub Actions to create and approve pull requests'." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Explain a failure
        if: failure()
        run: |
          echo "The new parsers version did not pass the check, so no pull request was opened and devel was not touched." >> "$GITHUB_STEP_SUMMARY"
          echo "Open the failed step above to see why (usually a compile error from an API change in the library)." >> "$GITHUB_STEP_SUMMARY"
