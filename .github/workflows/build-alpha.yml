name: Build Alpha APK

on:
  push:
    branches: [ devel, main ]
    paths-ignore:
      - 'CHANGELOG.md'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g. 1.5.0-alpha) — leave blank to auto-generate from commit count'
        required: false
        default: ''

concurrency:
  group: build-alpha
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build Alpha APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate version name
        id: version
        run: |
          COMMIT_COUNT=$(git rev-list --count HEAD)
          if [ -n "${{ github.event.inputs.version_name }}" ]; then
            VER="${{ github.event.inputs.version_name }}"
          else
            VER="1.${COMMIT_COUNT}"
          fi
          echo "VERSION_NAME=${VER}" >> $GITHUB_OUTPUT
          echo "VERSION_CODE=${COMMIT_COUNT}" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        run: |
          set -e
          PREV_TAG="alpha-latest-prev"
          if git rev-parse --verify "refs/tags/${PREV_TAG}" >/dev/null 2>&1; then
            RANGE="${PREV_TAG}..HEAD"
          else
            RANGE="-50"
          fi
          VERSION="${{ steps.version.outputs.VERSION_NAME }}"
          BUILD_LINK="[#${{ github.run_number }}](https://github.com/Space4414/Tsuki/actions/runs/${{ github.run_id }})"
          HEADER="## Alpha ${VERSION} (Build ${BUILD_LINK})"
          DATE="$(date -u +'%Y-%m-%d %H:%M UTC')"

          # If CHANGELOG.md starts with ## [Unreleased], use those hand-written notes
          if [ -f CHANGELOG.md ] && head -1 CHANGELOG.md | grep -q '^\#\# \[Unreleased\]'; then
            MANUAL="$(awk 'NR==1{next} /^\#\# /{exit} {print}' CHANGELOG.md)"
            printf '%s\n\n_%s_\n\n%s\n\n' "${HEADER}" "${DATE}" "${MANUAL}" > NEW_ENTRY.md
            # Drop the consumed [Unreleased] section so it isn't duplicated
            awk '/^\#\# \[Unreleased\]/{skip=1;next} /^\#\# / && skip{skip=0} !skip{print}' \
              CHANGELOG.md > CHANGELOG.tmp && mv CHANGELOG.tmp CHANGELOG.md
          else
            # Auto-generate from git log
            {
              echo "${HEADER}"
              echo ""
              echo "_${DATE}_"
              echo ""
              git log "$RANGE" --pretty=format:'- %s (%h)' --no-merges \
                | grep -viE '^- (chore|ci|docs)\(?(changelog|ci|build)\)?:|^- Update CHANGELOG' \
                | head -n 100 || true
              echo ""
              echo ""
            } > NEW_ENTRY.md
          fi

          if [ -f CHANGELOG.md ]; then
            cat NEW_ENTRY.md CHANGELOG.md > CHANGELOG.md.tmp
            mv CHANGELOG.md.tmp CHANGELOG.md
          else
            echo "# Changelog" > CHANGELOG.md
            echo "" >> CHANGELOG.md
            cat NEW_ENTRY.md >> CHANGELOG.md
          fi

          {
            echo 'BODY<<__EOF__'
            cat NEW_ENTRY.md
            echo '__EOF__'
          } >> $GITHUB_OUTPUT

      - name: Set up signing key
        run: |
          if [ -n "${{ secrets.KEYSTORE_FILE }}" ]; then
            echo "Using production keystore from secrets"
            echo "${{ secrets.KEYSTORE_FILE }}" | base64 -d > app/keystore.jks
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            echo "::warning::No KEYSTORE_FILE secret set — signing with committed debug.keystore."
            cp app/debug.keystore app/keystore.jks
            echo "KEYSTORE_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_ALIAS=debug" >> $GITHUB_ENV
            echo "KEY_PASSWORD=android" >> $GITHUB_ENV
          fi

      - name: Build Alpha Release APK
        run: ./gradlew assembleAlphaRelease --stacktrace --no-configuration-cache
        env:
          VERSION_NAME: ${{ steps.version.outputs.VERSION_NAME }}
          VERSION_CODE: ${{ steps.version.outputs.VERSION_CODE }}
          KEYSTORE_FILE: keystore.jks
          KEYSTORE_PASSWORD: ${{ env.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ env.KEY_ALIAS }}
          KEY_PASSWORD: ${{ env.KEY_PASSWORD }}

      - name: Upload Alpha APK (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Tsuki-alpha-${{ github.run_number }}
          path: app/build/outputs/apk/alpha/release/*.apk
          retention-days: 30

      - name: Snapshot previous alpha-latest tag for next diff
        run: |
          git fetch --tags --force
          if git rev-parse --verify refs/tags/alpha-latest >/dev/null 2>&1; then
            PREV_SHA=$(git rev-list -n 1 refs/tags/alpha-latest)
            git tag -f alpha-latest-prev "$PREV_SHA"
            git push -f origin refs/tags/alpha-latest-prev || true
          fi

      # --- NEW STEP: archive the download count before it gets wiped ---
      - name: Archive alpha-latest downloads before deletion
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          HISTORY_FILE=".github/download-history.json"
          mkdir -p .github

          if [ ! -f "$HISTORY_FILE" ]; then
            echo '{"stable": 0, "alpha": 0, "beta": 0}' > "$HISTORY_FILE"
          fi

          CURRENT=$(gh release view "alpha-latest" --json assets \
            --jq '[.assets[].downloadCount] | add // 0' 2>/dev/null || echo 0)

          PREV=$(grep -o '"alpha": *[0-9]*' "$HISTORY_FILE" | grep -o '[0-9]*$' || echo 0)
          NEW_TOTAL=$((PREV + CURRENT))

          python3 -c "
          import json
          with open('$HISTORY_FILE') as f:
              data = json.load(f)
          data['alpha'] = $NEW_TOTAL
          with open('$HISTORY_FILE', 'w') as f:
              json.dump(data, f, indent=2)
          "

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$HISTORY_FILE"
          git diff --quiet --cached || git commit -m "chore: archive alpha-latest downloads (+${CURRENT}) [skip ci]"
          git pull --rebase --no-edit origin ${{ github.ref_name }} \
            && git push origin HEAD:${{ github.ref_name }} \
            || echo "Download-history push skipped due to rebase conflict"

      - name: Delete old alpha-latest release
        run: gh release delete "alpha-latest" --yes || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete old alpha-latest tag
        run: git push origin :refs/tags/alpha-latest || true

      - name: Commit updated CHANGELOG.md
        continue-on-error: true
        run: |
          if git diff --quiet CHANGELOG.md; then
            echo "No changelog changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs(changelog): update alpha for build #${{ github.run_number }} [skip ci]"
          git pull --rebase --no-edit origin ${{ github.ref_name }} \
            && git push origin HEAD:${{ github.ref_name }} \
            || (git rebase --abort 2>/dev/null || true; echo "Changelog push skipped due to rebase conflict")

      - name: Create Alpha Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: alpha-latest
          name: "Tsuki Alpha ${{ steps.version.outputs.VERSION_NAME }} (Build #${{ github.run_number }})"
          body: |
            ## 🌙 Tsuki Alpha ${{ steps.version.outputs.VERSION_NAME }}

            > Auto-built from latest commit · [Build #${{ github.run_number }}](https://github.com/Space4414/Tsuki/actions/runs/${{ github.run_id }})

            ### What's new

            ${{ steps.changelog.outputs.BODY }}

            ### 📱 Pick the right APK for your device:

            | APK filename | Best for |
            |--------------|----------|
            | `Tsuki-alpha-arm64-release.apk` | Most modern phones (2017+) ✅ recommended |
            | `Tsuki-alpha-arm32-release.apk` | Older 32-bit Android phones |
            | `Tsuki-alpha-x86_64-release.apk` | Emulators / rare Intel phones |
            | `Tsuki-alpha-universal-release.apk` | Not sure? Grab this one |

            ---
            🌙 **[Tsuki Project](https://github.com/Space4414/Tsuki)** — open-source manga reader for Android
          files: app/build/outputs/apk/alpha/release/*.apk
          prerelease: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --- NEW STEP: recompute the all-time badge JSON ---
      - name: Update total-downloads badge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          HISTORY_FILE=".github/download-history.json"
          BADGE_FILE=".github/badge-downloads.json"

          HIST_STABLE=$(grep -o '"stable": *[0-9]*' "$HISTORY_FILE" | grep -o '[0-9]*$' || echo 0)
          HIST_ALPHA=$(grep -o '"alpha": *[0-9]*' "$HISTORY_FILE" | grep -o '[0-9]*$' || echo 0)
          HIST_BETA=$(grep -o '"beta": *[0-9]*' "$HISTORY_FILE" | grep -o '[0-9]*$' || echo 0)

          LIVE_TOTAL=0
          for tag in $(gh release list --limit 200 --json tagName --jq '.[].tagName'); do
            COUNT=$(gh release view "$tag" --json assets --jq '[.assets[].downloadCount] | add // 0')
            LIVE_TOTAL=$((LIVE_TOTAL + COUNT))
          done

          GRAND_TOTAL=$((HIST_STABLE + HIST_ALPHA + HIST_BETA + LIVE_TOTAL))

          python3 -c "
          import json
          badge = {
              'schemaVersion': 1,
              'label': 'Total Downloads',
              'message': f'{$GRAND_TOTAL:,}',
              'color': 'c8b8ff'
          }
          with open('$BADGE_FILE', 'w') as f:
              json.dump(badge, f, indent=2)
          "

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$BADGE_FILE"
          git diff --quiet --cached || git commit -m "chore: update total downloads badge [skip ci]"
          git pull --rebase --no-edit origin ${{ github.ref_name }} \
            && git push origin HEAD:${{ github.ref_name }} \
            || echo "Badge push skipped due to rebase conflict"

      - name: Notify Discord — Alpha release
        if: success() && startsWith('alpha-latest', 'alpha-')
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_ALPHA_WEBHOOK }}
          VERSION: ${{ steps.version.outputs.VERSION_NAME }}
          ALPHA_ROLE_ID: ${{ secrets.DISCORD_ALPHA_ROLE_ID }}
        run: |
          curl -fsSL -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{
              \"embeds\": [{
                \"title\": \"🔴 New Alpha Release\",
                \"description\": \"<@&${ALPHA_ROLE_ID}>\\nNew alpha build is available!\\nVersion: ${VERSION}\",
                \"color\": 15158332,
                \"fields\": [{
                  \"name\": \"Download\",
                  \"value\": \"Get it from [GitHub Releases](https://github.com/Space4414/Tsuki/releases/tag/alpha-latest)\"
                }]
              }]
            }"
