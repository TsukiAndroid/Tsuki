name: Sync Kotatsu Parsers Version

  on:
    schedule:
      - cron: '0 */6 * * *'
    workflow_dispatch:

  permissions:
    contents: write

  jobs:
    sync:
      name: Check & bump kotatsu-parsers-redo version
      runs-on: ubuntu-latest

      steps:
        - name: Checkout devel
          uses: actions/checkout@v4
          with:
            ref: devel
            token: ${{ secrets.GITHUB_TOKEN }}

        - name: Get latest parsers commit
          id: remote
          run: |
            LATEST=$(curl -fsSL \
              -H "Accept: application/vnd.github.sha" \
              "https://api.github.com/repos/Kotatsu-Redo/kotatsu-parsers-redo/commits/master")
            LATEST="${LATEST:0:10}"
            echo "sha=${LATEST}" >> $GITHUB_OUTPUT
            echo "Latest remote SHA: ${LATEST}"

        - name: Read current parsers version
          id: current
          run: |
            CURRENT=$(grep '^parsers' gradle/libs.versions.toml | sed 's/parsers = "\(.*\)"/\1/')
            echo "sha=${CURRENT}" >> $GITHUB_OUTPUT
            echo "Current local SHA: ${CURRENT}"

        - name: Already up to date
          if: steps.remote.outputs.sha == steps.current.outputs.sha
          run: echo "parsers version is already up to date (${{ steps.current.outputs.sha }})"

        - name: Bump version
          if: steps.remote.outputs.sha != steps.current.outputs.sha
          run: |
            sed -i 's/^parsers = ".*"/parsers = "${{ steps.remote.outputs.sha }}"/' gradle/libs.versions.toml
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add gradle/libs.versions.toml
            git commit -m "chore(deps): bump kotatsu-parsers-redo to ${{ steps.remote.outputs.sha }}"
            git push origin devel
            echo "Bumped: ${{ steps.current.outputs.sha }} to ${{ steps.remote.outputs.sha }}"
  