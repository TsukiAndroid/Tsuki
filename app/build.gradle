import java.time.LocalDateTime

plugins {
        id 'com.android.application'
        id 'kotlin-android'
        id 'com.google.devtools.ksp'
        id 'kotlin-parcelize'
        id 'dagger.hilt.android.plugin'
        id 'androidx.room'
        id 'org.jetbrains.kotlin.plugin.serialization'
        // enable if needed
        // id 'dev.reformator.stacktracedecoroutinator'

    id 'io.sentry.android.gradle' version '6.1.0'
}

android {
        compileSdk = 36
        buildToolsVersion = '35.0.0'
        namespace = 'io.github.landwarderer.futon'

        dependenciesInfo {
                // Disables dependency metadata when building APKs (for IzzyOnDroid/F-Droid)
                includeInApk = false
                // Disables dependency metadata when building Android App Bundles (for Google Play)
                includeInBundle = false
        }

        defaultConfig {
                applicationId 'com.space4414.tsuki'
                minSdk = 23
                targetSdk = 36
                versionCode System.getenv('VERSION_CODE') ? System.getenv('VERSION_CODE').toInteger() : 1
                versionName System.getenv('VERSION_NAME') ?: 'Alpha-1.1'
                generatedDensities = []
                testInstrumentationRunner 'io.github.landwarderer.futon.HiltTestRunner'
                ksp {
                        arg('room.generateKotlin', 'true')
                }
                androidResources {
                        // https://issuetracker.google.com/issues/408030127
                        generateLocaleConfig false
                }
                def localProperties = new Properties()
                def localPropertiesFile = rootProject.file('local.properties')
                if (localPropertiesFile.exists()) {
                        localProperties.load(new FileInputStream(localPropertiesFile))
                }
                resValue 'string', 'tg_backup_bot_token', localProperties.getProperty('tg_backup_bot_token', '')
        }
        signingConfigs {
                release {
                        // When KEYSTORE_FILE env var is set (CI with real secrets), use that keystore.
                        // Otherwise fall back to the stable debug.keystore committed to the repo.
                        // Using the same key every build means users can install updates without
                        // having to uninstall first (no signature mismatch / "package conflicts" error).
                        storeFile     file(System.getenv('KEYSTORE_FILE') ?: 'debug.keystore')
                        storePassword System.getenv('KEYSTORE_PASSWORD') ?: 'android'
                        keyAlias      System.getenv('KEY_ALIAS')          ?: 'debug'
                        keyPassword   System.getenv('KEY_PASSWORD')        ?: 'android'
                }
        }
        flavorDimensions "release"
        productFlavors {
                alpha {
                        dimension "release"
                        applicationId "io.github.landwarderer.futon.alpha"
                        versionNameSuffix "-alpha"
                        buildConfigField "String", "UPDATE_CHANNEL", '"alpha"'
                        buildConfigField "String", "RELEASES_URL", '"https://api.github.com/repos/Space4414/Tsuki/releases"'
                }
                beta {
                        dimension "release"
                        applicationId "io.github.landwarderer.futon.beta"
                        versionNameSuffix "-beta"
                        buildConfigField "String", "UPDATE_CHANNEL", '"beta"'
                        buildConfigField "String", "RELEASES_URL", '"https://api.github.com/repos/Space4414/Tsuki/releases"'
                }
                stable {
                        dimension "release"
                        applicationId "com.space4414.tsuki"
                        buildConfigField "String", "UPDATE_CHANNEL", '"stable"'
                        buildConfigField "String", "RELEASES_URL", '"https://api.github.com/repos/Space4414/Tsuki/releases"'
                }
        }
        buildTypes {
                debug {
                        buildConfigField "String", "SENTRY_DSN", '""'
                }
                release {
                        minifyEnabled true
                        shrinkResources true
                        proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                        signingConfig signingConfigs.release
                        buildConfigField "String", "SENTRY_DSN", "\"${System.getenv('SENTRY_DSN') ?: ''}\""
                }
                nightly {
                        initWith release
                        applicationIdSuffix = '.nightly'
                        signingConfig signingConfigs.release
                        buildConfigField "String", "SENTRY_DSN", "\"${System.getenv('SENTRY_DSN') ?: ''}\""
                }
        }
        buildFeatures {
                viewBinding true
                buildConfig true
        }
        packagingOptions {
                resources {
                        excludes += [
                                'META-INF/README.md',
                                'META-INF/NOTICE.md',
                                'META-INF/*.kotlin_module',
                                'META-INF/AL2.0',
                                'META-INF/LGPL2.1',
                                'META-INF/proguard/*',
                                'META-INF/com.android.tools/**',
                                'kotlin/**',
                                'kotlin-tooling-metadata.json',
                                'DebugProbesKt.bin',
                                '*.txt'
                        ]
                }
                jniLibs {
                        useLegacyPackaging = false
                        excludes += ['**/libsentry-android-replay.so']
                }
        }
        // Per-ABI APK splits dramatically reduce per-device download size,
        // while a universal APK is still produced for sideloading & GitHub releases.
        splits {
                abi {
                        enable true
                        reset()
                        include 'arm64-v8a', 'armeabi-v7a', 'x86_64'
                        universalApk true
                }
        }
        bundle {
                language { enableSplit = true }
                density  { enableSplit = true }
                abi      { enableSplit = true }
        }
        sourceSets {
                androidTest.assets.srcDirs += files("$projectDir/schemas".toString())
                main.java.srcDirs += 'src/main/kotlin/'
                alpha.res.srcDirs += ['src/alpha/res']
                beta.res.srcDirs += ['src/beta/res']
                stable.res.srcDirs += ['src/stable/res']
                nightly.res.srcDirs += ['src/nightly/res']
        }
        compileOptions {
                coreLibraryDesugaringEnabled true
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
        }
        kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
        freeCompilerArgs += [
                        '-opt-in=kotlin.ExperimentalStdlibApi',
                        '-opt-in=kotlinx.coroutines.ExperimentalCoroutinesApi',
                        '-opt-in=kotlinx.coroutines.ExperimentalForInheritanceCoroutinesApi',
                        '-opt-in=kotlinx.coroutines.InternalForInheritanceCoroutinesApi',
                        '-opt-in=kotlinx.coroutines.FlowPreview',
                        '-opt-in=kotlin.contracts.ExperimentalContracts',
                        '-opt-in=coil3.annotation.ExperimentalCoilApi',
                        '-opt-in=coil3.annotation.InternalCoilApi',
                        '-opt-in=kotlinx.serialization.ExperimentalSerializationApi',
                        '-Xjspecify-annotations=strict',
                        '-Xannotation-default-target=first-only',
                        '-Xtype-enhancement-improvements-strict-mode'
                ]
        }
        room {
                schemaDirectory "$projectDir/schemas"
        }
        lint {
                abortOnError true
                disable 'MissingTranslation', 'PrivateResource', 'SetJavaScriptEnabled', 'SimpleDateFormat'
        }
        testOptions {
                unitTests.includeAndroidResources true
                unitTests.returnDefaultValues false
                kotlinOptions {
                        freeCompilerArgs += ['-opt-in=org.koitharu.kotatsu.parsers.InternalParsersApi']
                }
        }
        applicationVariants.configureEach { variant ->
                variant.outputs.each { output ->
                        // Nightly: derive version code/name from the build date.
                        if (variant.buildType.name == 'nightly') {
                                def now = LocalDateTime.now()
                                output.versionCodeOverride = now.format("yyMMdd").toInteger()
                                output.versionNameOverride = 'N' + now.format("yyyyMMdd")
                        }

                        // Rename every APK (split + universal) so filenames use the short arch
                        // labels that AppUpdateRepository.getDeviceArch() returns:
                        //   arm64-v8a   → arm64   (modern 64-bit phones)
                        //   armeabi-v7a → arm32   (older 32-bit phones like Huawei P9 Lite)
                        //   x86_64      → x86_64  (emulators / Intel phones)
                        //   (no filter) → universal
                        // Without this renaming the asset-name search in fetchUpdate() falls back
                        // to "universal" for arm32 devices even when a proper arm32 APK exists.
                        def abi = output.filters?.find { f -> f.filterType == 'ABI' }?.identifier
                        def abiLabel = abi
                                ?.replace('arm64-v8a',   'arm64')
                                ?.replace('armeabi-v7a', 'arm32')
                                ?: 'universal'
                        output.outputFileName =
                                "Tsuki-${variant.flavorName}-${abiLabel}-${variant.buildType.name}.apk"
                }
        }
}
dependencies {
        def parsersVersion = libs.versions.parsers.get()
        if (System.properties.containsKey('parsersVersionOverride')) {
                // usage:
                // -DparsersVersionOverride=$(curl -s https://api.github.com/repos/kotatsu-redo/kotatsu-parsers-redo/commits/master -H "Accept: application/vnd.github.sha" | cut -c -10)
                parsersVersion = System.getProperty('parsersVersionOverride')
        }
        //noinspection UseTomlInstead
        implementation("com.github.clquwu:kotatsu-parsers-redo:$parsersVersion") {
                exclude group: 'org.json', module: 'json'
        }

        coreLibraryDesugaring libs.desugar.jdk.libs
        implementation libs.kotlin.stdlib
        implementation libs.kotlinx.coroutines.android
        implementation libs.kotlinx.coroutines.guava

        implementation libs.androidx.appcompat
        implementation libs.androidx.core
        implementation libs.androidx.activity
        implementation libs.androidx.fragment
        implementation libs.androidx.transition
        implementation libs.androidx.collection
        implementation libs.lifecycle.viewmodel
        implementation libs.lifecycle.service
        implementation libs.lifecycle.process
        implementation libs.androidx.constraintlayout
        implementation libs.androidx.documentfile
        implementation libs.androidx.swiperefreshlayout
        implementation libs.androidx.recyclerview
        implementation libs.androidx.viewpager2
        implementation libs.androidx.preference
        implementation libs.androidx.biometric
        implementation libs.material
        implementation libs.androidx.lifecycle.common.java8
        implementation libs.androidx.webkit
    implementation libs.injekt.core

        implementation libs.androidx.work.runtime
        implementation libs.guava
    implementation libs.quickjs.kt

    // Foldable/Window layout
    implementation libs.androidx.window

        implementation libs.rxjava
        implementation libs.rxandroid

        implementation libs.androidx.room.runtime
        implementation libs.androidx.room.ktx
        ksp libs.androidx.room.compiler

    implementation platform(libs.okhttp.bom)
        implementation libs.okhttp
        implementation libs.okhttp.tls
        implementation libs.okhttp.dnsoverhttps
        implementation libs.okio
        implementation libs.kotlinx.serialization.json

        implementation libs.adapterdelegates
        implementation libs.adapterdelegates.viewbinding

        implementation libs.hilt.android
        ksp libs.hilt.compiler
        implementation libs.androidx.hilt.work
        ksp libs.androidx.hilt.compiler

        implementation libs.coil.core
        implementation libs.coil.network
        implementation libs.coil.gif
        implementation libs.coil.svg
        implementation libs.avif.decoder
        implementation libs.ssiv
        implementation libs.disk.lru.cache
        implementation libs.markwon
        implementation libs.kizzyrpc

        implementation libs.conscrypt.android
        implementation libs.sentry.android

        debugImplementation libs.leakcanary.android
        nightlyImplementation libs.leakcanary.android
        debugImplementation libs.workinspector

        testImplementation libs.junit
        testImplementation libs.json
        testImplementation libs.kotlinx.coroutines.test

        androidTestImplementation libs.androidx.runner
        androidTestImplementation libs.androidx.rules
        androidTestImplementation libs.androidx.test.core
        androidTestImplementation libs.androidx.junit

        androidTestImplementation libs.kotlinx.coroutines.test

        androidTestImplementation libs.androidx.room.testing
        androidTestImplementation libs.moshi.kotlin

        androidTestImplementation libs.hilt.android.testing
        kspAndroidTest libs.hilt.android.compiler
}

sentry {
        org = "appfuton"
        projectName = "android"
        authToken = System.getenv('SENTRY_AUTH_TOKEN') ?: ''

        // Disable all uploads 
        includeSourceContext = false
        autoUploadProguardMapping = false
        autoUploadSourceContext = false
        
        // Disable instrumentation that causes manifest/UUID changes
        tracingInstrumentation { enabled = false }
        autoInstallation { enabled = false }
        
        // Disable telemetry and dependency reporting that cause non-deterministic builds
        includeDependenciesReport = false
        telemetry = false
}
