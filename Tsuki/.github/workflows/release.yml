name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.60.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Compute version info
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#v}"
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)
          PATCH=${PATCH:-0}
          CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          echo "VERSION_NAME=$VERSION" >> $GITHUB_OUTPUT
          echo "VERSION_CODE=$CODE" >> $GITHUB_OUTPUT
          echo "TAG_NAME=$TAG" >> $GITHUB_OUTPUT

      - name: Set up keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_FILE }}" ]; then
            echo "Using keystore from secrets"
            echo "${{ secrets.KEYSTORE_FILE }}" | base64 -d > ${{ github.workspace }}/keystore.jks
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            echo "No keystore secret – auto-generating a signing key for this build"
            keytool -genkeypair \
              -alias tsuki \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -keystore ${{ github.workspace }}/keystore.jks \
              -storepass tsukidev \
              -keypass tsukidev \
              -dname "CN=Tsuki,OU=Dev,O=Space4414,L=Unknown,ST=Unknown,C=US" \
              -noprompt
            echo "KEYSTORE_PASSWORD=tsukidev" >> $GITHUB_ENV
            echo "KEY_ALIAS=tsuki" >> $GITHUB_ENV
            echo "KEY_PASSWORD=tsukidev" >> $GITHUB_ENV
            echo "::warning::Auto-generated keystore used. Add KEYSTORE_FILE/KEYSTORE_PASSWORD/KEY_ALIAS/KEY_PASSWORD secrets for a stable release signing key."
          fi

      - name: Build Release APKs
        env:
          VERSION_NAME: ${{ steps.version.outputs.VERSION_NAME }}
          VERSION_CODE: ${{ steps.version.outputs.VERSION_CODE }}
          KEYSTORE_FILE: ${{ github.workspace }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ env.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ env.KEY_ALIAS }}
          KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace --no-configuration-cache

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG_NAME }}
          name: "Tsuki ${{ steps.version.outputs.VERSION_NAME }}"
          body: |
            ## Tsuki ${{ steps.version.outputs.VERSION_NAME }}

            ### 📱 Pick the right APK for your device:
            | APK | Best for |
            |-----|----------|
            | `arm64-v8a` | Most modern phones (2017+) ✅ recommended |
            | `armeabi-v7a` | Older 32-bit Android phones |
            | `x86_64` | Emulators / rare Intel phones |
            | `universal` | Not sure? Just grab this one |
          files: app/build/outputs/apk/release/*.apk
          prerelease: false
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean up keystore
        if: always()
        run: rm -f ${{ github.workspace }}/keystore.jks